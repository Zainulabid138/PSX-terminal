name: Build Android APK

# Builds an installable (debug-signed) APK in the cloud — no local Android
# Studio / SDK needed. Run it from the GitHub "Actions" tab (Run workflow),
# then download the APK from the run's "Artifacts". Debug APKs install fine on
# any phone (enable "Install unknown apps").

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'   # Capacitor 8 / Android Gradle Plugin require JDK 21

      # ubuntu-latest ships the Android SDK pre-installed with licenses accepted
      # (ANDROID_HOME / ANDROID_SDK_ROOT are set), so no setup-android action is
      # needed — Gradle auto-downloads any missing platform/build-tools.

      - name: Versions
        run: node -v && npm -v && npx cap --version

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Vite build (web)
        run: npm run build

      - name: Capacitor sync (android)
        run: npx cap sync android

      - name: Build debug APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PSX-Terminal-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
