name: Build Android APK

# Builds an installable (debug-signed) APK in the cloud — no local Android
# Studio / SDK needed. Run it from the GitHub "Actions" tab (Run workflow),
# then download the APK from the run's "Artifacts". Debug APKs install fine on
# any phone (enable "Install unknown apps").

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'   # Capacitor 8 / Android Gradle Plugin require JDK 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Build web + sync Capacitor
        run: |
          npm run build
          npx cap sync android

      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PSX-Terminal-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
